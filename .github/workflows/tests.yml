name: Tests
"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the PDF renderer's system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # the Docker image's Python
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel and unlocked test dependencies
        run: python -m pip install "$(find dist -name '*.whl')[dev,docs]"
      - run: python -m pip check
      - run: ruff check src tests examples tools
      - run: python tools/check_boundary.py
      - run: python -m pytest -q --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
      - run: sphinx-build -W -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-and-docs
          path: |
            dist/
            docs/_build/html/
