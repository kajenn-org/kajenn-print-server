name: Docker image
"on":
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            kajenn-print-server:ci
            kajenn-print-server:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test with authentication off
        run: |
          docker run -d --name print-open -p 8001:8000 -e PRINT_AUTH=off kajenn-print-server:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8001/print/health && break; sleep 1; done
          curl -fsS -H 'Content-Type: application/json' -d '{"html":"<h1>CI</h1>"}' \
            -o open.pdf http://127.0.0.1:8001/print/pdf
          head -c 5 open.pdf | grep -q '%PDF-'
      - name: Smoke test with token authentication
        run: |
          export KAJENN_ADMIN_TOKEN="$(openssl rand -hex 24)"
          export KAJENN_STORAGE_KEY="$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          docker run -d --name print-token -p 8002:8000 \
            -e KAJENN_ADMIN_TOKEN -e KAJENN_STORAGE_KEY kajenn-print-server:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8002/print/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"html":"<p>x</p>"}' http://127.0.0.1:8002/print/pdf)" = 401
          KEY="$(curl -fsS -H "Authorization: Bearer $KAJENN_ADMIN_TOKEN" -H 'Content-Type: application/json' \
            -d '{"label":"ci","tags":["print"]}' http://127.0.0.1:8002/_server/tokens/issue \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["key"])')"
          curl -fsS -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"html":"<h1>CI</h1>"}' -o token.pdf http://127.0.0.1:8002/print/pdf
          head -c 5 token.pdf | grep -q '%PDF-'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Smoke test the compose file
        run: |
          docker compose config --quiet
          PRINT_PORT=8003 docker compose up --no-build --detach --wait
          python -m pip install --quiet .
          echo '<h1>compose</h1>' > compose.html
          kajenn-print compose.html --url http://127.0.0.1:8003
          head -c 5 compose.pdf | grep -q '%PDF-'
      - name: Container logs
        if: always()
        run: |
          docker logs print-open || true
          docker logs print-token || true
          docker compose logs || true
          docker compose down --volumes || true
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
